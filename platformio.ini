; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

board_build.ldscript = imxrt1062_t41_xip.ld

; StaTeX target build. Teensy defaults to -fno-exceptions -fno-rtti, which is
; exactly what StaTeX wants (STX-BLD-01) — so no overrides are needed (the
; MicroTeX-era -fexceptions / -fno-rtti-unflag have been removed). Glyphs come
; from the flash atlas, so no SD / OpenFontRender dependency.
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; StaTeX uses only main.cpp; the OpenFontRender/SD helper is for the old path.
build_src_filter = +<main.cpp>

build_flags =
    -std=gnu++17
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,-Map,firmware.map
    ; --- TFT_eSPI config (version-controlled; do NOT edit User_Setup.h) ---
    -DUSER_SETUP_LOADED
    -DILI9488_DRIVER          ; 320x480 panel
    -DTFT_MISO=12
    -DTFT_MOSI=11
    -DTFT_SCLK=13
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DSPI_FREQUENCY=20000000  ; ILI9488 is unreliable above ~20MHz on SPI
    -DLOAD_GLCD

build_unflags =
    -std=gnu++11
    -std=gnu++14

debug_build_flags =
    -g
    -Wl,--print-memory-usage

; Host-native environment for StaTeX unit tests (no Arduino, no hardware).
; StaTeX core is pure POD C++17 with no heap/exceptions/RTTI, so it builds and
; runs on the host toolchain. See docs/StaTeX-dev-process.md.
[env:native]
platform = native
test_framework = unity
; Tests only exercise lib/StaTeX; don't try to compile the Arduino src/.
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
    -DSTATEX_HOST_TEST
